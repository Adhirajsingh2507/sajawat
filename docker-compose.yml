# Local integrated stack (Milestone 0.8, AD-29) — LOCAL DEV ONLY.
# Cloud uses Cloud Run + MongoDB Atlas, never this file.
#   docker compose up --build
# Secrets: override the JWT_* defaults below via a gitignored .env at repo root.
name: sajawat

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 }).ok']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    init: true
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # NODE_ENV=staging locally: avoids the AD-14 production localhost guards
      # (compose uses localhost origins) AND avoids the dev-only pino-pretty
      # transport, which is a devDependency excluded from the --prod image.
      NODE_ENV: staging
      PORT: 8080
      API_BASE_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      MONGODB_URI: mongodb://mongo:27017/sajawat_dev
      JWT_ISSUER: sajawat-api
      JWT_AUDIENCE: sajawat-clients
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me-000000000000}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me-00000000000}
    ports:
      - '4000:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
      args:
        # Browser-facing → must be the host URL, not the internal `api` hostname.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    init: true
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/admin.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
    init: true
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3001:8080'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo-data:
