# Reusable quality gate (extracted from the 0.10a ci.yml in Milestone 0.10b.2).
#
# Called via `uses:` by BOTH ci.yml and deploy-staging.yml so the deploy pipeline
# runs the EXACT same gate set as CI — no drift. Self-contained: declares its own
# permissions and the MONGOMS_VERSION pin (a called workflow does not inherit the
# caller's top-level env).
#
# Gate: install (frozen) -> lint -> typecheck -> build -> test (+coverage).
# Needs NO real secrets (test/setup.ts self-provisions test env).

name: Quality gate

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # Default mongod (8.x) SIGSEGVs on some hosts; 6.0.14 is the validated pin (0.9).
  # Also keys the mongod binary cache below.
  MONGOMS_VERSION: 6.0.14

jobs:
  quality:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Corepack must be enabled BEFORE setup-node so its `cache: pnpm` finds pnpm.
      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Setup Node 22 (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enforce Node 22 (D1)
        run: |
          MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          echo "Node $(node -v) / pnpm $(pnpm -v)"
          if [ "$MAJOR" != "22" ]; then
            echo "::error::Expected Node 22 (contract), got $(node -v)"
            exit 1
          fi

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint · Typecheck · Build
        run: pnpm exec turbo run lint typecheck build --cache-dir=.turbo

      - name: Test (with coverage)
        run: pnpm exec turbo run test --cache-dir=.turbo -- --coverage

      - name: Upload coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          if-no-files-found: ignore
          retention-days: 14
          path: |
            services/api/coverage
            packages/shared/coverage
            apps/web/coverage
            apps/admin/coverage
