# Deploy — staging (Milestone 0.10b.2) · API ONLY
#
# SCOPE DECISION (AD-54): apps/web and apps/admin are still unmodified
# create-next-app starter boilerplate (D4) — no product UI, no Cloud Run
# services. Deploying them now (env-specific images, NEXT_PUBLIC wiring,
# per-service readiness/traffic-shift) would be placeholder complexity with no
# product value. Frontend deploy automation lands with the Phase-1 web (1.4) and
# admin (1.7) UIs; adding them to this workflow later is incremental.
#
# Trigger: every push to develop (after the shared quality gate passes) + manual
# dispatch. Auth is keyless via Workload Identity Federation (0.10b.1): the job
# declares `environment: staging`, so the OIDC token carries the environment
# claim the deployer-SA binding requires. Deploys by IMMUTABLE DIGEST with a
# no-traffic readiness gate before shifting traffic, so a bad revision never
# serves users. D16 stays OPEN until 0.10b.3 adds production CD + rollback.
#
# Prerequisites (operator): 0.10b.1 provisioned on sajawat-staging
# (provision.sh + verify.sh green), secret VALUES injected, and the `staging`
# GitHub Environment populated with the variables referenced below.

name: Deploy (staging)

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

# Never cancel an in-flight deploy; queue the next one.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required to mint the WIF OIDC token

jobs:
  # Same gate set as CI — never deploy code that hasn't passed lint/type/build/test.
  verify:
    name: Quality gate
    uses: ./.github/workflows/_quality.yml

  build:
    name: Build & push API image
    needs: verify
    runs-on: ubuntu-22.04
    environment: staging # binds the OIDC `environment` claim -> WIF deployer SA
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push API image (SHA-tagged)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: ${{ vars.GCP_AR_IMAGE_PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  deploy:
    name: Deploy API to Cloud Run (staging)
    needs: build
    runs-on: ubuntu-22.04
    environment: staging
    steps:
      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy (no traffic) → readiness gate → shift traffic
        env:
          SERVICE: ${{ vars.API_SERVICE }}
          REGION: ${{ vars.GCP_REGION }}
          PROJECT: ${{ vars.GCP_PROJECT_ID }}
          IMAGE: ${{ vars.GCP_AR_IMAGE_PREFIX }}/api@${{ needs.build.outputs.digest }}
          RUNTIME_SA: ${{ vars.API_RUNTIME_SA }}
          JWT_ISSUER: ${{ vars.APP_JWT_ISSUER }}
          JWT_AUDIENCE: ${{ vars.APP_JWT_AUDIENCE }}
          CORS_ORIGINS: ${{ vars.APP_CORS_ORIGINS }}
          API_BASE_URL: ${{ vars.APP_API_BASE_URL }}
          # Optional, non-secret ids (D18/D19). Empty string when the Environment
          # variable is unset — the deploy then omits them and the app stays in its
          # dormant default (online checkout 501 / WhatsApp skip-and-log).
          RAZORPAY_KEY_ID: ${{ vars.APP_RAZORPAY_KEY_ID }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ vars.APP_WHATSAPP_PHONE_NUMBER_ID }}
        run: |
          set -euo pipefail

          # `gcloud run deploy` is CREATE-OR-UPDATE: it provisions the staging
          # service on the first run and updates it on subsequent runs — no manual
          # pre-creation needed. AD-52: JWT_ISSUER/JWT_AUDIENCE are PLAIN env vars
          # (--set-env-vars), never Secret Manager. The earlier hand-deployed
          # staging service is treated as DISPOSABLE and deleted out-of-band (see
          # the deployment-plan runbook / open-debt D16); a pipeline-created service
          # has no secret-typed JWT_ISSUER/JWT_AUDIENCE, so no in-place
          # secret->literal conversion is required here.
          # Cloud Run forbids --no-traffic when CREATING a new service, so adapt to
          # whether the service already exists:
          #   * FIRST deploy (absent): plain create — the sole new revision must take
          #     100% traffic — then health-check the LIVE url; no candidate, no shift.
          #   * EXISTING: safe candidate flow — --no-traffic --tag=candidate, readiness
          #     gate on the candidate url, and shift traffic ONLY after it passes.
          if gcloud run services describe "$SERVICE" \
               --region="$REGION" --project="$PROJECT" >/dev/null 2>&1; then
            EXISTS=1
            CANDIDATE_FLAGS=(--no-traffic --tag=candidate)
            echo "Service $SERVICE exists → candidate flow. Deploying $IMAGE (no traffic, tag=candidate)…"
          else
            EXISTS=0
            CANDIDATE_FLAGS=()
            echo "Service $SERVICE does not exist → first deploy. Creating from $IMAGE (serves immediately)…"
          fi

          # Build the secret/env bindings. Base set is always present; the optional
          # D18/D19 bindings are added only when usable, so a no-keys deploy stays
          # green and the app keeps its dormant default. A secret is bound only if
          # it has an ENABLED version (an empty container would make :latest
          # unresolvable and fail the deploy); a non-secret id is added only if its
          # Environment variable is set. RAZORPAY_KEY_ID / WHATSAPP_PHONE_NUMBER_ID
          # are always plain env vars (never secret-typed), so no AD-52 type flip.
          SECRET_FLAGS="MONGODB_URI=MONGODB_URI:latest,JWT_ACCESS_SECRET=JWT_ACCESS_SECRET:latest,JWT_REFRESH_SECRET=JWT_REFRESH_SECRET:latest"
          ENV_FLAGS="NODE_ENV=staging,JWT_ISSUER=${JWT_ISSUER},JWT_AUDIENCE=${JWT_AUDIENCE},CORS_ORIGINS=${CORS_ORIGINS},API_BASE_URL=${API_BASE_URL}"
          for s in RAZORPAY_KEY_SECRET RAZORPAY_WEBHOOK_SECRET WHATSAPP_ACCESS_TOKEN; do
            if gcloud secrets versions list "$s" --project="$PROJECT" \
                 --filter='state=ENABLED' --format='value(name)' 2>/dev/null | grep -q .; then
              SECRET_FLAGS="${SECRET_FLAGS},${s}=${s}:latest"
              echo "  + optional secret bound: $s"
            else
              echo "  - optional secret skipped (no enabled version): $s"
            fi
          done
          if [ -n "${RAZORPAY_KEY_ID:-}" ]; then ENV_FLAGS="${ENV_FLAGS},RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}"; fi
          if [ -n "${WHATSAPP_PHONE_NUMBER_ID:-}" ]; then ENV_FLAGS="${ENV_FLAGS},WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}"; fi

          gcloud run deploy "$SERVICE" \
            --image="$IMAGE" \
            --region="$REGION" --project="$PROJECT" \
            --service-account="$RUNTIME_SA" \
            "${CANDIDATE_FLAGS[@]}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --set-secrets="$SECRET_FLAGS" \
            --set-env-vars="$ENV_FLAGS"

          BASE_URL="$(gcloud run services describe "$SERVICE" \
            --region="$REGION" --project="$PROJECT" --format='value(status.url)')"
          if [ "$EXISTS" = "1" ]; then
            # Cloud Run tag URL pattern: https://TAG---SERVICE-HASH.run.app
            CHECK_URL="https://candidate---${BASE_URL#https://}"
            echo "Candidate revision URL: $CHECK_URL"
          else
            CHECK_URL="$BASE_URL"
            echo "Live service URL: $CHECK_URL"
          fi

          echo "Readiness gate: GET $CHECK_URL/api/v1/health (expect 200; 503 while DB not ready)…"
          ok=0
          for i in $(seq 1 30); do
            code="$(curl -s -o /tmp/health.json -w '%{http_code}' "$CHECK_URL/api/v1/health" || true)"
            if [ "$code" = "200" ]; then
              echo "Healthy on attempt $i:"; cat /tmp/health.json; echo
              ok=1; break
            fi
            echo "attempt $i/30: HTTP ${code:-000}; retrying in 5s…"
            sleep 5
          done

          if [ "$ok" != "1" ]; then
            if [ "$EXISTS" = "1" ]; then
              echo "::error::Readiness gate FAILED — candidate unhealthy. Traffic NOT shifted; previous revision still serves."
            else
              echo "::error::First-deploy health check FAILED — the newly created service is unhealthy (it already serves 100% traffic; inspect Cloud Run logs / secrets / env)."
            fi
            exit 1
          fi

          if [ "$EXISTS" = "1" ]; then
            echo "Shifting 100% traffic to the candidate revision…"
            gcloud run services update-traffic "$SERVICE" \
              --region="$REGION" --project="$PROJECT" \
              --to-tags=candidate=100
          fi

          echo "✓ Deploy complete. Live URL: $BASE_URL"
