# CI — Milestone 0.10a (refactored in 0.10b.2 to share the quality gate)
#
# Gate pipeline for every PR and every push to main/develop:
#   quality (reusable _quality.yml) + e2e smoke + Docker build-validation +
#   security scan (1.9b: gitleaks secrets + dependency audit).
#
# The quality job now lives in .github/workflows/_quality.yml and is shared with
# deploy-staging.yml so both run the IDENTICAL gate set.
#
# Deployment lives in deploy-staging.yml (0.10b.2, API-only). Production CD
# (tag-triggered, reviewer-gated) + rollback is still pending in 0.10b.3.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# One in-flight run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/_quality.yml

  security:
    name: Security scan
    # 1.9b: secret scanning (blocks) + dependency audit (blocks only on
    # high/critical in PRODUCTION deps — dev-only test-tooling advisories are
    # reported but don't gate unrelated work).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout (full history for the secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks version

      - name: Secret scan (gitleaks) — blocks on any finding
        run: ./gitleaks git . --redact --no-banner

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Setup Node 22 (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Dependency audit — full report (non-blocking visibility)
        run: pnpm audit || true

      - name: Dependency audit — block on high/critical in production deps
        run: pnpm audit --prod --audit-level high

      # Dependency review needs GitHub Advanced Security + Dependency graph,
      # which aren't enabled on this repo (private, free plan) — the action
      # hard-errors when unavailable. Non-blocking so it doesn't red every PR;
      # real dependency-vuln gating is the `pnpm audit --prod` step above.
      - name: Dependency review (PRs only — advisory, needs GHAS)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  e2e:
    name: E2E smoke (chromium)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Setup Node 22 (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web (and deps)
        run: pnpm exec turbo run build --filter=@sajawat/web

      - name: Run E2E smoke
        run: pnpm test:e2e

  docker:
    name: Docker build validation
    # Build-only validation of the 0.8 images; skipped on PRs to save minutes.
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}.Dockerfile
          push: false
          load: false
          tags: sajawat-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
