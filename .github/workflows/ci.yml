# CI — Milestone 0.10a (Phase 0 final)
#
# Gate pipeline for every PR and every push to main/develop:
#   install (frozen) -> lint -> typecheck -> build -> test (+coverage) -> e2e smoke
# plus a Docker build-validation job on pushes.
#
# Deployment (Cloud Run / Artifact Registry / WIF / Secret Manager) is DEFERRED
# to Milestone 0.10b — intentionally absent here.
#
# Contract enforced (closes D1): Node 22 via .nvmrc + an explicit guard.
# Provisioning matches Docker (0.8): Corepack-activated pnpm from packageManager.
# CI-side D13: gate jobs need NO real secrets — test/setup.ts self-provisions test
# env; only MONGOMS_VERSION is pinned here (also keys the mongod binary cache).

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# One in-flight run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Default mongod (8.x) SIGSEGVs on some hosts; 6.0.14 is the validated pin (0.9).
  # Also referenced by the binary cache key below. Overridable per environment.
  MONGOMS_VERSION: 6.0.14

jobs:
  quality:
    name: Lint · Typecheck · Build · Test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Corepack must be enabled BEFORE setup-node so its `cache: pnpm` finds pnpm.
      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Setup Node 22 (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Enforce Node 22 (D1)
        run: |
          MAJOR="$(node -p "process.versions.node.split('.')[0]")"
          echo "Node $(node -v) / pnpm $(pnpm -v)"
          if [ "$MAJOR" != "22" ]; then
            echo "::error::Expected Node 22 (contract), got $(node -v)"
            exit 1
          fi

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ env.MONGOMS_VERSION }}

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint · Typecheck · Build
        run: pnpm exec turbo run lint typecheck build --cache-dir=.turbo

      - name: Test (with coverage)
        run: pnpm exec turbo run test --cache-dir=.turbo -- --coverage

      - name: Upload coverage artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          if-no-files-found: ignore
          retention-days: 14
          path: |
            services/api/coverage
            packages/shared/coverage
            apps/web/coverage
            apps/admin/coverage

  e2e:
    name: E2E smoke (chromium)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Setup Node 22 (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web (and deps)
        run: pnpm exec turbo run build --filter=@sajawat/web

      - name: Run E2E smoke
        run: pnpm test:e2e

  docker:
    name: Docker build validation
    # Build-only validation of the 0.8 images; skipped on PRs to save minutes.
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}.Dockerfile
          push: false
          load: false
          tags: sajawat-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
