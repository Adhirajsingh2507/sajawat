# CI — Milestone 0.10a (refactored in 0.10b.2 to share the quality gate)
#
# Gate pipeline for every PR and every push to main/develop:
#   quality (reusable _quality.yml) + e2e smoke + Docker build-validation.
#
# The quality job now lives in .github/workflows/_quality.yml and is shared with
# deploy-staging.yml so both run the IDENTICAL gate set.
#
# Deployment lives in deploy-staging.yml (0.10b.2, API-only). Production CD
# (tag-triggered, reviewer-gated) + rollback is still pending in 0.10b.3.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# One in-flight run per ref; cancel superseded runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/_quality.yml

  e2e:
    name: E2E smoke (chromium)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack (pnpm from packageManager)
        run: corepack enable

      - name: Setup Node 22 (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web (and deps)
        run: pnpm exec turbo run build --filter=@sajawat/web

      - name: Run E2E smoke
        run: pnpm test:e2e

  docker:
    name: Docker build validation
    # Build-only validation of the 0.8 images; skipped on PRs to save minutes.
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, admin]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/${{ matrix.service }}.Dockerfile
          push: false
          load: false
          tags: sajawat-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
